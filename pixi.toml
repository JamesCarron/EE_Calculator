[workspace]
authors = ["James Carron"]
channels = ["conda-forge"]
name = "EE_Calculator"
platforms = ["win-64"]
version = "0.1.0"

[tasks]
build = "python src/eecalc/build_page.py"
test = "python tests/run_all.py"
setup-em = "python scripts/setup_openems.py"
where = "python scripts/where.py"
migrate = "python scripts/migrate.py"

[dependencies]
# 3.11 because that is what the openEMS v0.0.36 Windows wheels are built for
python = "3.11.*"
pip = "*"
numpy = "*"
h5py = "*"
platformdirs = "*"

[pypi-dependencies]
# The package itself, editable: this is what makes the src/ layout importable from
# scripts/ and tests/ without path hacks.
eecalc = { path = ".", editable = true }
