# Single static page, no other routes. no-cache (not no-store) so a repeat
# visit still gets a fast 304 instead of a stale calculator after a deploy.
server {
    listen 80;
    server_tokens off;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-cache";
    }
}
